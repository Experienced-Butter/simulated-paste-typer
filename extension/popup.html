<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Simulated Paste Typer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <img class="logo" src="icons/icon48.png" alt="" width="34" height="34">
    <div class="titles">
      <h1 data-i18n="pTitle">模拟录入粘贴助手</h1>
      <p class="sub" data-i18n="pSub">剪贴板文本 → 模拟键盘输入</p>
    </div>
    <span class="ver" id="versionLabel"></span>
  </header>

  <div class="status" id="statusRow">
    <span class="dot" id="statusDot"></span>
    <span id="statusText" data-i18n="pChecking">正在检测当前页面…</span>
  </div>

  <section class="card">
    <div class="field">
      <label for="delaySelect" data-i18n="pDelayLabel">触发后等待</label>
      <select id="delaySelect"></select>
    </div>
    <div class="field">
      <label for="modeSelect" data-i18n="pModeLabel">输入方式</label>
      <select id="modeSelect"></select>
    </div>
    <div class="permLine">
      <span id="permText" data-i18n="pPermChecking">真实键盘模拟：检测中…</span>
      <button class="mini" id="grantBtn" type="button" data-i18n="pGrantBtn" hidden>授权</button>
    </div>
  </section>

  <button id="injectBtn" class="primary" type="button" data-i18n="pInject">读取剪贴板并输入到光标处</button>
  <p class="hint" data-i18n="pTip">用法：先在目标输入框里点一下让光标出现，再点上面的按钮。</p>
  <p class="feedback" id="feedback" hidden></p>

  <section class="card clipCard">
    <div class="clipHead">
      <span data-i18n="pClipHead">剪贴板预览</span>
      <button class="mini" id="peekBtn" type="button" data-i18n="pPeek">刷新</button>
    </div>
    <pre id="clipPreview" class="preview" data-i18n="pPreviewNotRead">（未读取）</pre>
  </section>

  <footer class="foot">
    <label class="check">
      <input type="checkbox" id="fabToggle">
      <span data-i18n="pFabToggle">页面悬浮按钮</span>
    </label>
    <a href="#" id="optionsLink" data-i18n="pOptionsLink">设置与说明</a>
  </footer>

  <!-- 共享配置 → 界面语言 → 弹窗逻辑（不允许内联脚本，符合 MV3 的 CSP） -->
  <script src="shared/config.js"></script>
  <script src="shared/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
